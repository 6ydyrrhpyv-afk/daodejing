<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>道德经·处事练习室</title>
  <meta name="description" content="读一段经典，想清一件事。从一个真实问题出发，读有来源的原文，写下可执行的行动并复盘。收录《道德经》全部 81 章（王弼本）。">
  <link rel="stylesheet" href="./styles.css">
  <script>
  /* 加载兜底：让「打不开」变成「看得到原因」，而不是永远停在「正在加载」 */
  (function () {
    function showFatal(msg, hint) {
      var m = document.getElementById('main');
      if (!m || m.dataset.fatal) return;
      m.dataset.fatal = '1';
      m.innerHTML = '<section class="card"><h2 class="card__title">页面初始化失败</h2>'
        + '<p class="card__text">' + msg + '</p>'
        + (hint ? '<p class="card__text">' + hint + '</p>' : '') + '</section>';
    }
    window.addEventListener('error', function (e) {
      if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
        showFatal('资源加载失败：' + (e.target.src || e.target.href || '未知资源')
          + '。多半是网络无法访问 GitHub Pages。', '若您在中国大陆用手机流量（未开 VPN）打开，本站默认托管在 GitHub Pages，常因网络限制打不开。请改用国内镜像：https://yy-1015yy-d0gulehrrf00e186c-1480960352.tcloudbaseapp.com/');
      } else if (e && e.message) {
        showFatal('脚本错误：' + e.message);
      }
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      showFatal('未处理的异步错误：' + ((r && r.message) || r || '未知'));
    });
    window.addEventListener('DOMContentLoaded', function () {
      setTimeout(function () {
        var m = document.getElementById('main');
        if (m && !m.dataset.fatal && /正在加载/.test(m.textContent || '')) {
          showFatal('加载超时（已超过 10 秒仍在「正在加载」）。', '若您在中国大陆用手机流量（未开 VPN）打开，多半是网络无法访问 GitHub Pages。请改用国内镜像：https://yy-1015yy-d0gulehrrf00e186c-1480960352.tcloudbaseapp.com/');
        }
      }, 10000);
    });
  })();
  </script>
</head>

      </ul>
    </nav>
    <div class="wrap" id="storage-bar"></div>
  </header>

  <main class="wrap" id="main" tabindex="-1">
    <p>正在加载内容……</p>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div class="footer-mountain" aria-hidden="true" id="footer-art"></div>
      <p>本站收录《道德经》全部 81 章（王弼本），每章附 James Legge（理雅各，1891）公版英译，便于中英对照。释义为本站整理，非古代注家原话；不提供多家注解库，不做逐字校勘。</p>
      <p>数据默认保存在当前浏览器；可在「设置 → 跨设备同步」用一组同步码在手机与电脑之间同步草稿、行动与复盘。本站不扮演老子给出决策，也不把古籍当作万能答案。页面装饰为原创矢量插绘。</p>
    </div>
  </footer>

  <div id="toast" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="./js/app.mjs"></script>
</body>
